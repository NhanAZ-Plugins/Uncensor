name: Test text formatting and build plugin

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test formatting preservation
    runs-on: ubuntu-24.04
    steps:
      - name: Check out Uncensor source
        uses: actions/checkout@v7.0.1
      - name: Check out pinned Axolotl-PM source
        uses: actions/checkout@v7.0.1
        with:
          repository: axolotl-pm/PocketMine-MP
          ref: dfe0d07e48a9e8d5a4a242fa43ff1cd3b743a955
          path: .test-dependencies/axolotl-pm
          persist-credentials: false
      - name: Check out Axolotl-PM PHP setup helper
        uses: actions/checkout@v7.0.1
        with:
          repository: axolotl-pm/setup-php-action
          ref: b8c3f9add4f2ad4a5e2624a1112aba899ee8db0e
          path: .test-dependencies/setup-php-action
          persist-credentials: false
      - name: Set up Axolotl-PM PHP environment
        shell: bash
        env:
          INPUT_PHP-VERSION: "8.1"
          INPUT_PM-VERSION-MAJOR: "5"
          INPUT_INSTALL-PATH: ./.php-bin
        run: node "$GITHUB_WORKSPACE/.test-dependencies/setup-php-action/dist/index.js"
      - name: Install pinned Axolotl-PM dependencies
        run: composer install --working-dir=.test-dependencies/axolotl-pm --no-interaction --prefer-dist --no-progress --no-scripts --no-plugins
      - name: Test text formatting behavior
        run: php tests/formatting.php .test-dependencies/axolotl-pm

  build:
    needs: test
    uses: NhanAZ/DevTools/.github/workflows/build-plugin.yml@8d13a75aaf4f330fdbd93737d58be9cacc41e262 # v1.0.15
    with:
      axolotl-ref: dfe0d07e48a9e8d5a4a242fa43ff1cd3b743a955
      phpstan: max
